<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Idyll</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../../fonts.css">
<style>
:root{--bg:#f2ede4;--ink:#2b2925;--muted:#7a7266;--rule:#dcd4c6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Timeless Sans",-apple-system,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:56px}
h1{margin:0 0 6px;font:400 44px/1.05 "Timeless Serif",Georgia,serif}p{margin:0 0 32px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:36px 24px}
figure{margin:0}.big{width:100%;aspect-ratio:1;border-radius:22.5%;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 34px rgba(0,0,0,.12)}
.row{display:flex;align-items:flex-end;gap:14px;margin-top:14px}.row img{border-radius:22.5%}
figcaption{margin-top:10px;font-size:15px}figcaption span{display:block;color:var(--muted);font-size:13.5px}
</style></head><body><main>
<h1>Halftone cygnet icons</h1><p>Printed from the riso hero's cygnet. Shown large and at real home-screen sizes (60, 40 and 29 points).</p>
<div class="grid">
<figure><img class="big" src="../../img/icons/D-on-blue.png" alt=""><div class="row"><img src="../../img/icons/D-on-blue.png" width="60" height="60" alt=""><img src="../../img/icons/D-on-blue.png" width="40" height="40" alt=""><img src="../../img/icons/D-on-blue.png" width="29" height="29" alt=""></div><figcaption>D, pink on blue<span>Boldest and most ownable; reads at every size.</span></figcaption></figure>
<figure><img class="big" src="../../img/icons/B-pink.png" alt=""><div class="row"><img src="../../img/icons/B-pink.png" width="60" height="60" alt=""><img src="../../img/icons/B-pink.png" width="40" height="40" alt=""><img src="../../img/icons/B-pink.png" width="29" height="29" alt=""></div><figcaption>B, pink on newsprint<span>Closest to the poster; clean and warm.</span></figcaption></figure>
<figure><img class="big" src="../../img/icons/A-hero.png" alt=""><div class="row"><img src="../../img/icons/A-hero.png" width="60" height="60" alt=""><img src="../../img/icons/A-hero.png" width="40" height="40" alt=""><img src="../../img/icons/A-hero.png" width="29" height="29" alt=""></div><figcaption>A, two inks<span>Pink over a misregistered blue; richer, a little muddy small.</span></figcaption></figure>
<figure><img class="big" src="../../img/icons/C-blue.png" alt=""><div class="row"><img src="../../img/icons/C-blue.png" width="60" height="60" alt=""><img src="../../img/icons/C-blue.png" width="40" height="40" alt=""><img src="../../img/icons/C-blue.png" width="29" height="29" alt=""></div><figcaption>C, blue with a pink edge<span>Quieter; the riso look is subtler.</span></figcaption></figure>
<figure><img class="big" src="../../img/icons/E-dither.png" alt=""><div class="row"><img src="../../img/icons/E-dither.png" width="60" height="60" alt=""><img src="../../img/icons/E-dither.png" width="40" height="40" alt=""><img src="../../img/icons/E-dither.png" width="29" height="29" alt=""></div><figcaption>E, 1-bit ink<span>The dither direction; very graphic.</span></figcaption></figure>
</div></main></body></html>
