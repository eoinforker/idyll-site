<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idyll Home, more life</title>
<link rel="stylesheet" href="../../../fonts.css">
<link rel="stylesheet" href="../kit.css">
<!-- The approved tokens and components, copied unchanged from final/final.html. -->
<link rel="stylesheet" href="final-tokens.css">
<style>
/* Home, Android, with more life. 1 now, 2 A plate, 3 B brand tiles, 4 C second ink, 5 D the blend.
   ?mode=light|dark, ?only=N, ?accent=magenta|blue|black. Same tokens as final/; only the phone is Android sized. */
.cell { width: 393px; }
.phone { width: 393px; height: 852px; }
.island { width: 12px; height: 12px; margin-left: -6px; top: 17px; border-radius: 50%; }
.sb { padding: 2px 26px 0 30px; font: 500 15px/1 var(--sys); }
.hi { width: 108px; margin-left: -54px; height: 4px; bottom: 10px; }
.scr { padding: 46px 0 22px; }
.row { flex-wrap: wrap; row-gap: 60px; }

.rows > li { height: 54px; }
.door { display: flex; align-items: center; justify-content: flex-end; gap: 1px; width: 52px; margin-left: 14px; }
.door .ic { width: 16px; height: 16px; }
.mins { margin-left: auto; }
.inbox { display: flex; gap: 10px; margin-top: 10px; }
.inbox .tile { width: 30px; height: 30px; border-radius: 8px; }
.inbox .tile .bm { width: 16px; height: 16px; }
.more .tile { color: var(--soft); }

/* A and D: today's minutes printed on a small plate, as on the 2 by 2 widget. */
.tplate { position: relative; height: 150px; margin: 18px 24px 0; padding: 18px 20px 16px; color: var(--cream); overflow: hidden; display: flex; flex-direction: column; }
.tplate > .crop { position: absolute; inset: 8px; --c: rgba(255,246,238,.85); }
.tplate .t-label { color: rgba(255,246,238,.82); }
.tplate .pstop { color: var(--plate-stop, var(--ink)); }
.tplate .cyg { position: absolute; right: 22px; bottom: 26px; width: 108px; height: 64px; }
/* The water under the cygnet, in the second ink: two rows of dots that fade at both ends. */
.tplate .water { position: absolute; right: 12px; bottom: 15px; width: 132px; height: 11px;
  background: radial-gradient(circle, var(--blue) 1.3px, transparent 1.7px) 0 0 / 5px 5.5px;
  -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
.week { display: flex; align-items: center; gap: 7px; height: 14px; margin-top: auto; }
.week i { display: block; border-radius: 50%; background: rgba(255,246,238,.5); flex: none; }
.week i.today { background: var(--plate-stop, var(--ink)); }

/* B: the official colour in Idyll's tile shape. */
.brand .tile { box-shadow: none; color: #fff; }
.brand .tile.youtube { background: #ff0000; }
.brand .tile.instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
.brand .tile.facebook { background: #0866ff; }
.brand .tile.linkedin { background: #0a66c2; }
.brand .tile.reddit { background: #ff4500; }
.brand .tile.snapchat { background: #fffc00; }
.brand .tile.x, .brand .tile.tiktok, .brand .tile.threads { background: #000; box-shadow: inset 0 0 0 1px var(--tile-edge); }
.brand .tile.tiktok svg { filter: drop-shadow(-1px -1px 0 #25f4ee) drop-shadow(1px 1px 0 #fe2c55); }
.brand .more .tile { background: var(--tile-bg); box-shadow: inset 0 0 0 1px var(--tile-edge); color: var(--soft); }

/* C: the second ink, in a few chosen places. In black it is magenta; in magenta it is the accent itself. */
.ink2 .door, .ink2 .door .ic { color: var(--today, var(--pink)); }
.ink2 .bar-track > i { background: var(--today, var(--pink)); }
.ink2 .btn.primary.focus { background: var(--today, var(--pink)); color: #fff6ee; }
.ink2 .todayn { color: var(--today, var(--pink)); }
.m-light.acc-black .ink2 .btn.primary.focus { color: #fff6ee; }
/* D: only the door arrows take it, the words stay soft. */
.arrows .door .ic { color: var(--today, var(--pink)); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7.5 16.5 16.5 7.5M9 7.5h7.5V15"/></symbol>
</svg>
<div class="board" id="board"></div>
<template id="screens"></template>

<script>
window.IDYLL_ROOT = '../../../';
(() => {
  const q = new URLSearchParams(location.search), want = q.get('mode');
  const accent = q.get('accent') || 'magenta';
  const board = document.getElementById('board');
  const modes = ['light', 'dark'].filter(m => !want || m === want);

  /* The founder's sample day. Home shows four apps, then the rest in one row. */
  const shown = [['youtube', 'YouTube', 15], ['instagram', 'Instagram', 36], ['facebook', 'Facebook', 16], ['x', 'X', 21]];
  const inbox = ['instagram', 'facebook', 'x', 'tiktok', 'linkedin', 'snapchat'];
  const week = [122, 151, 98, 140, 117, 163, 139];

  const cyg = (w, h, cell, extra = '') => `<span class="print smallcyg" data-print="cygnet" data-flat data-water="none" data-cell="${cell}" aria-hidden="true" style="display:block;width:${w}px;height:${h}px" ${extra}></span>`;
  const out = '<span class="t-small soft door">App<svg class="ic"><use href="#i-out"/></svg></span>';
  const head = `<div class="navb" style="padding:0 20px 0 24px;margin-top:6px;justify-content:space-between"><span class="t-wordmark logo" style="display:flex;align-items:center;gap:10px">${cyg(34, 20.2, 1.8)}<span>Idyll<b class="stop">.</b></span></span><a>Settings</a></div>`;

  /* Today as it is now, or with the second ink on the bar. */
  const todayPlain = bar => `<div class="pad" style="margin-top:22px">
      <p class="t-label">Today in the real apps</p>
      <p class="t-num-l" style="font-size:50px;margin-top:10px">139 <span class="soft">min</span></p>
      ${bar ? '<div class="bar-track" style="margin-top:14px"><i style="width:77%"></i></div>' : ''}
      <p class="t-label" style="margin-top:9px;display:flex;justify-content:space-between"><span>Android's count</span>${bar ? '<span>Allowance 180 min</span>' : ''}</p>
    </div>`;
  /* The plate: minutes, the cygnet stretching, its water in the second ink. D adds the week as dots. */
  const dots = () => `<span class="week" aria-hidden="true">${week.map((v, i) => { const d = Math.round(4 + 7 * (v - 90) / 73); return `<i class="${i === 6 ? 'today' : ''}" style="width:${d}px;height:${d}px"></i>`; }).join('')}</span>`;
  const todayPlate = withWeek => `<div class="plate tplate"><div class="crop"></div>
      <p class="t-label">Today in the real apps</p>
      <p class="t-num-l" style="font-size:50px;margin-top:10px">139 <span style="opacity:.82">min</span><b class="pstop">.</b></p>
      ${withWeek ? dots() : '<p class="t-label" style="margin-top:auto">Android\'s count</p>'}
      <span class="print cyg sigcyg" data-print="cygnet" data-pose="stretch" data-cell="2" data-ink="#fff6ee" aria-hidden="true"></span><span class="water" aria-hidden="true"></span>
    </div>`;

  const rows = (snapClass) => `<ul class="rows pad" style="margin-top:22px">
      ${shown.map(([t, n, m]) => `<li><span data-t="${t}"${t === 'snapchat' ? ` class="${snapClass}"` : ''}></span><span class="t-body-m">${n}</span><span class="t-small soft n mins">${m} min</span>${out}</li>`).join('')}
      <li class="more"><span class="tile"><svg class="ic" style="width:22px;height:22px"><use href="#i-more"/></svg></span><span class="t-body-m">5 more</span><span class="t-small soft n mins">51 min</span><span class="door"><svg class="ic" style="color:var(--chev);width:22px;height:22px"><use href="#i-chev"/></svg></span></li>
    </ul>`;
  const messages = snapClass => `<div class="pad" style="margin-top:20px">
      <p class="t-label">Messages</p>
      <div class="inbox">${inbox.map(t => `<span data-t="${t}" class="sm${t === 'snapchat' ? ' ' + snapClass : ''}"></span>`).join('')}</div>
    </div>`;
  const buttons = `<div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px">
      <a class="btn primary focus" style="height:64px;flex-direction:column;gap:5px">Focus<span class="t-cap" style="opacity:.8">50 min</span></a>
      <a class="btn secondary" style="height:64px;flex-direction:column;gap:5px">Post Mode<span class="t-cap soft">Real apps, 10 min</span></a>
    </div>`;
  const paste = `<div class="pad" style="margin-top:12px"><div class="field"><svg class="ic soft" style="width:20px"><use href="#i-link"/></svg><span class="t-body soft" style="font-size:16px">Paste a link</span><a class="t-small" style="margin-left:auto;font-size:15px">Paste</a></div></div>`;
  const foot = `<div class="pad" style="margin-top:auto;display:flex;justify-content:space-between;align-items:center"><span class="t-small" style="display:flex;align-items:center;gap:8px">${cyg(26, 15.4, 1.6)}Resting from 23:00</span><span class="t-small soft">Free, for good.</span></div>`;

  const OPTS = [
    ['Now', '', todayPlain(false), ''],
    ['A. Plate', '', todayPlate(false), ''],
    ['B. Brand tiles', 'brand', todayPlain(false), 'colour'],
    ['C. Second ink', 'ink2', todayPlain(true), ''],
    ['D. Plate, with the week in dots', 'arrows', todayPlate(true), ''],
  ];
  document.getElementById('screens').innerHTML = OPTS.map(([cap, cls, today, snap]) => `<div class="cell home"><p class="cap">${cap}</p>
    <div class="phone ${cls}"><div class="scr">${head}${today}${rows(snap)}${messages(snap)}${buttons}${paste}${foot}</div></div></div>`).join('');

  function prep(root, mode) {
    const dark = mode === 'dark';
    const acc = { magenta: '#d81b7a', blue: '#2d5bff', black: '#161514' }[accent], ink2 = accent === 'magenta' ? '#2d5bff' : '#d81b7a';
    root.querySelectorAll('.phone').forEach(p => { if (dark) p.classList.add('lightbar', 'lighthi'); if (p.classList.contains('brand')) p.classList.add('mono'); });
    root.querySelectorAll('.smallcyg').forEach(g => { if (!g.dataset.ink) g.dataset.ink = dark ? '#fff6ee' : acc; });
    root.querySelectorAll('.sigcyg').forEach(g => g.dataset.water = ink2);
  }
  modes.forEach(m => {
    board.insertAdjacentHTML('beforeend', `<p class="rowname">${m === 'dark' ? 'Dark' : 'Light'}<b class="stop">.</b></p>`);
    const row = document.createElement('section'); row.className = 'row';
    [...document.getElementById('screens').content.cloneNode(true).children].forEach(c => {
      c.classList.add(`m-${m}`); if (m === 'dark') c.classList.add('mono'); if (accent !== 'magenta') c.classList.add(`acc-${accent}`);
      row.appendChild(c); prep(c, m);
    });
    board.appendChild(row);
  });
})();
</script>
<script src="../kit-poses.js"></script>
</body>
</html>
