<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idyll app, final</title>
<link rel="stylesheet" href="../../../fonts.css">
<link rel="stylesheet" href="../kit.css">
<style>
/* Idyll app, final. C (Night) is the master; light mode mirrors it in the site's paper and ink.
   Tokens live on each phone so the accent can be swapped per screen: --pink is the accent, --blue the second ink. See SPEC.md. */
.acc-blue { --pink: #2d5bff; --blue: #d81b7a; }
/* Black: ink accent on paper with an ink plate; on night the accent turns cream and the plate is a raised near-black.
   Magenta is the second ink, and it carries the stop on the plate and today's bar, where ink or cream would vanish. */
.acc-black { --blue: #d81b7a; --today: #d81b7a; --plate-stop: #d81b7a; }
.m-dark .phone {
  --bg: #141416; --surface: #1f1f22; --fg: #fff6ee; --soft: rgba(255,246,238,.62); --hair: rgba(255,246,238,.13);
  --track: rgba(255,246,238,.10); --track-strong: rgba(255,246,238,.14);
  --primary-bg: var(--pink); --primary-fg: #fff6ee; --line: rgba(255,246,238,.85);
  --tile-bg: #1f1f22; --tile-edge: rgba(255,246,238,.12);
  --field-bg: rgba(255,246,238,.06); --field-edge: rgba(255,246,238,.14);
  --crop: rgba(255,246,238,.7); --box-edge: rgba(255,246,238,.3);
  --sw-off: rgba(255,246,238,.18); --chev: rgba(255,246,238,.4);
}
.m-light .phone {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #161514; --soft: #5b5853; --hair: rgba(22,21,20,.14);
  --track: rgba(22,21,20,.08); --track-strong: rgba(22,21,20,.12);
  --primary-bg: #161514; --primary-fg: #fff6ee; --line: #161514;
  --tile-bg: #ffffff; --tile-edge: rgba(22,21,20,.16);
  --field-bg: transparent; --field-edge: rgba(22,21,20,.3);
  --crop: #161514; --box-edge: rgba(22,21,20,.32);
  --sw-off: rgba(22,21,20,.16); --chev: rgba(22,21,20,.4);
}
/* A whole screen printed on the plate (Hello in light, Focus in both). */
.m-light .phone.onplate, .m-dark .phone.onplate { background: var(--plate, var(--pink)); --bg: var(--plate, var(--pink)); --fg: #fff6ee; --soft: rgba(255,246,238,.82); --primary-bg: #161514; --primary-fg: #fff6ee; --line: #fff6ee; --crop: #fff6ee; }
.acc-black.m-light .phone { --pink: #161514; --plate: #161514; }
.acc-black.m-dark .phone { --pink: #fff6ee; --plate: #29292d; --primary-fg: #161514; --on-accent: #161514; }
.acc-black.m-light .phone.onplate, .acc-black.m-dark .phone.onplate { --primary-bg: #fff6ee; --primary-fg: #161514; }
.acc-black.m-dark .tag b { color: #161514; }
.plate { background: var(--plate, var(--pink)); }
.onplate .stop { color: var(--plate-stop, var(--ink)); }
.onplate .tag b { background: var(--cream); color: var(--plate, var(--pink)); }
.onplate .tag svg { fill: var(--cream); }
.pcrop { display: none; position: absolute; inset: 52px 12px 46px; }
.onplate .pcrop { display: block; }

.board { display: block; width: max-content; }
.cap { color: #5b5853 !important; } .cap b { color: #161514 !important; }
.row { display: flex; gap: 72px; align-items: flex-start; }
.rowname { font: 500 26px/1 var(--sans); letter-spacing: -.03em; margin: 0 0 22px 4px; }
.rowname + .row { margin-bottom: 70px; }
.section { font: 500 44px/1 var(--sans); letter-spacing: -.045em; margin: 60px 0 10px; }
.section + p { font: 400 15px/1.4 var(--sans); color: var(--soft); margin: 0 0 30px; max-width: 60em; }
body.only .rowname, body.only .section, body.only .section + p { display: none; }
body.only .rowname + .row { margin: 0; }
.phone { background: var(--bg); color: var(--fg); }
.scr { padding: 54px 0 34px; }
.pad { padding: 0 24px; }

/* Type roles (pt). */
.t-display { font: 500 88px/.9 var(--sans); letter-spacing: -.06em; }
.t-hero { font: 500 58px/.9 var(--sans); letter-spacing: -.055em; text-align: center; }
.t-count { font: 500 104px/1 var(--sans); letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.t-title-l { font: 500 48px/1.02 var(--sans); letter-spacing: -.045em; }
.t-title-m { font: 500 38px/1.02 var(--sans); letter-spacing: -.045em; }
.t-num-l { font: 500 48px/1 var(--sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.t-num-m { font: 500 30px/1 var(--sans); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.t-head { font: 500 21px/1.2 var(--sans); letter-spacing: -.02em; }
.t-note { font: 500 18px/1.25 var(--sans); letter-spacing: -.02em; }
.t-sheet { font: 500 24px/1.1 var(--sans); letter-spacing: -.03em; }
.t-body { font: 400 17px/1.45 var(--sans); }
.t-body-m { font: 500 17px/1.45 var(--sans); }
.t-small { font: 400 14px/1.45 var(--sans); }
.t-cap { font: 400 13px/1.4 var(--sans); }
.t-label { font: 400 11.5px/1.2 var(--mono); letter-spacing: .03em; color: var(--soft); }
.t-wordmark { font: 600 20px/1 var(--sans); letter-spacing: -.02em; }
.soft { color: var(--soft); }
.n { font-variant-numeric: tabular-nums; }
.ik { color: var(--plate-stop, var(--ink)); font-weight: inherit; }

.foot { margin-top: auto; padding: 0 24px 8px; display: grid; gap: 6px; }
.btn { font: 500 18px/1 var(--sans); letter-spacing: -.01em; }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); }
.btn.secondary { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--fg); }
.lnk { display: flex; align-items: center; justify-content: center; height: 44px; font: 400 16px/1 var(--sans); }
.navb { height: 44px; display: flex; align-items: center; padding: 0 16px 0 10px; font: 400 16px/1 var(--sans); }
.rows > li { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--hair); }
.rows > li:first-child { border-top: 1px solid var(--hair); }
.tile { background: var(--tile-bg); box-shadow: inset 0 0 0 1px var(--tile-edge); color: var(--fg); }
.m-dark .tile.snapchat { background: var(--tile-bg); box-shadow: inset 0 0 0 1px var(--tile-edge); }
.box { width: 24px; height: 24px; margin-left: auto; box-shadow: inset 0 0 0 1.5px var(--box-edge); flex: none; }
.box.on { background: var(--pink); box-shadow: none; display: grid; place-items: center; color: var(--on-accent, var(--cream)); }
.box.on .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.tick { color: var(--pink); margin-left: auto; }
.tick .ic { stroke-width: 2.2; }
.chev { margin-left: auto; color: var(--chev); }
.sw { background: var(--sw-off); }
.sw.on { background: var(--pink); }
.crop { --c: var(--crop); }
.field { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--field-bg); box-shadow: inset 0 0 0 1px var(--field-edge); }
.bar-track { height: 4px; background: var(--track-strong); }
.bar-track > i { display: block; height: 100%; background: var(--fg); }
.day { width: 40px; height: 40px; display: grid; place-items: center; font: 500 15px/1 var(--sans); }
.day.on { background: var(--fg); color: var(--bg); }
.day.off { box-shadow: inset 0 0 0 1px var(--box-edge); }
.chrome-bg { background: var(--bg); }
.ld { flex: 1; min-width: 18px; border-bottom: 1.5px dotted currentColor; transform: translateY(-4px); opacity: .55; align-self: center; }
.lrow { display: flex; align-items: center; gap: 12px; }
.btn.oncream { box-shadow: inset 0 0 0 1.5px var(--cream); color: var(--cream); }


/* The plate sheet (D's first-run overlay) and its riffs. Same in both modes. */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; color: var(--cream); }
.sheet > .crop { position: absolute; inset: 14px 14px 40px; --c: var(--cream); }
.sheet .t-label { color: var(--cream); }
.sheet a { color: var(--cream); }
.sheet .stop { color: var(--plate-stop, var(--ink)); }
.sheet .struck::after, .onplate .struck::after { background: var(--blue); }

/* Instagram and YouTube watch pages, drawn in their own type for the riffs. */
.ig { flex: 1; position: relative; overflow: hidden; background: #fff; color: #0c1014; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
.ig.dark { background: #000; color: #f5f5f5; }
.ig .ihd { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.ig .ihd span:last-child { display: flex; gap: 18px; }
.ig .stories { display: flex; gap: 14px; padding: 6px 14px 12px; font-size: 11.5px; text-align: center; }
.ig .stories i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 2px #d6249f; margin-bottom: 5px; font: 700 20px/1 Arial; font-style: normal; }
.ig .ph { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13.5px; }
.ig .ph b { font-weight: 600; } .ig .ph small { color: #737373; margin-left: 4px; font-size: 13px; }
.ig .ph i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 Arial; font-style: normal; }
.ig .img { aspect-ratio: 1; overflow: hidden; } .ig .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig .acts { display: flex; gap: 14px; padding: 10px 12px 4px; }
.ig .cap2 { padding: 2px 12px; font-size: 13.5px; }
.yw { flex: 1; position: relative; overflow: hidden; background: #fff; color: #0f0f0f; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
.yw.dark { background: #0f0f0f; color: #f1f1f1; }
.yw .player { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
.yw .player img { width: 100%; height: 100%; object-fit: cover; opacity: .45; display: block; }
.yw .player .rp { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 13px; }
.yw .player .rp span { display: grid; justify-items: center; gap: 6px; }
.yw .player .rp .ic { width: 40px; height: 40px; }
.yw .player .pb { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #f00; }
.yw h3 { font-size: 18px; line-height: 1.3; font-weight: 600; padding: 12px 12px 4px; }
.yw .mt { font-size: 12.5px; color: #606060; padding: 0 12px; } .yw.dark .mt { color: #aaa; }
.yw .chn { display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 14px; font-weight: 500; }
.yw .chn i { width: 36px; height: 36px; border-radius: 50%; background: #ffe8d4; color: #9a4a12; display: grid; place-items: center; font: 600 14px/1 Arial; font-style: normal; }

/* Appearance. */
.swatch { position: relative; height: 112px; padding: 14px; display: flex; align-items: flex-end; color: var(--cream); font: 500 15px/1 var(--sans); white-space: nowrap; }
.choice { position: relative; }
.choice.sel { outline: 2px solid var(--fg); outline-offset: 4px; }
.choice .ok { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--cream); color: #161514; display: grid; place-items: center; }
.choice .ok .ic { width: 16px; height: 16px; stroke-width: 2.6; }
/* Mode: three square segments, the swatches' language. */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: inset 0 0 0 1.5px var(--line); }
.seg span { height: 44px; display: grid; place-items: center; font: 400 16px/1 var(--sans); }
.seg span + span { box-shadow: inset 1.5px 0 0 var(--line); }
.seg span.on { background: var(--fg); color: var(--bg); font-weight: 500; }
.icn { display: grid; justify-items: center; gap: 10px; }
.icn img { width: 84px; height: 84px; border-radius: 22.5%; display: block; }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="board-head"><h1>Idyll, final<b class="stop">.</b></h1><p>C, Night, is the master. Light mode mirrors it screen for screen in the site's paper and ink. The app follows the phone's appearance setting. Riffs on the first-run sheet and the electric blue accent follow below.</p></div>
</div>

<!-- The twelve screens. -->
<template id="screens">
  <!-- 1 Hello -->
  <div class="cell"><p class="cap">Hello</p>
  <div class="phone hello"><div class="pcrop crop"></div><div class="scr">
    <div class="pad" style="margin-top:24px"><span class="tag"><b>Free, for good</b><svg viewBox="0 0 26 22" aria-hidden="true"><circle cx="3" cy="3.7" r="3.6"/><circle cx="3" cy="11" r="3.6"/><circle cx="3" cy="18.3" r="3.6"/><circle cx="9.6" cy="3.7" r="2.9"/><circle cx="9.6" cy="11" r="2.9"/><circle cx="9.6" cy="18.3" r="2.9"/><circle cx="15.8" cy="3.7" r="2.1"/><circle cx="15.8" cy="11" r="2.1"/><circle cx="15.8" cy="18.3" r="2.1"/><circle cx="21.2" cy="3.7" r="1.3"/><circle cx="21.2" cy="11" r="1.3"/><circle cx="21.2" cy="18.3" r="1.3"/><circle cx="25" cy="7.3" r=".6"/><circle cx="25" cy="14.7" r=".6"/></svg></span></div>
    <div style="margin:28px 24px 0;height:236px;display:grid;place-items:center"><div class="print cyg sigcyg" data-print="cygnet" style="width:300px"></div></div>
    <div class="pad" style="margin-top:34px">
      <h1 class="t-display" style="margin-left:-4px">Idyll<b class="stop">.</b></h1>
      <p class="t-body" style="margin-top:20px">Your social apps without the feeds. Messages, friends, search and posting all stay.</p>
      <p class="t-small soft" style="margin-top:10px">No account. Idyll collects nothing.</p>
    </div>
    <div class="foot"><a class="btn primary">Start</a><a class="lnk">How it works</a></div>
  </div></div></div>

  <!-- 2 Pick -->
  <div class="cell"><p class="cap">Pick your apps</p>
  <div class="phone"><div class="scr">
    <div class="pad" style="margin-top:28px">
      <h1 class="t-title-m">Which ones do<br>you use?</h1>
      <p class="t-body soft" style="margin-top:10px">Pick any. You can change this later.</p>
    </div>
    <ul class="rows pad" style="margin-top:22px">
      <li style="height:48px"><span data-t="youtube" class="sm"></span><span class="t-body">YouTube</span><span class="box on"><svg class="ic"><use href="#i-check"/></svg></span></li>
      <li style="height:48px"><span data-t="instagram" class="sm"></span><span class="t-body">Instagram</span><span class="box on"><svg class="ic"><use href="#i-check"/></svg></span></li>
      <li style="height:48px"><span data-t="facebook" class="sm"></span><span class="t-body">Facebook</span><span class="box"></span></li>
      <li style="height:48px"><span data-t="x" class="sm"></span><span class="t-body">X</span><span class="box on"><svg class="ic"><use href="#i-check"/></svg></span></li>
      <li style="height:48px"><span data-t="snapchat" class="sm"></span><span class="t-body">Snapchat</span><span class="box"></span></li>
      <li style="height:48px"><span data-t="tiktok" class="sm"></span><span class="t-body">TikTok</span><span class="box"></span></li>
      <li style="height:48px"><span data-t="reddit" class="sm"></span><span class="t-body">Reddit</span><span class="box on"><svg class="ic"><use href="#i-check"/></svg></span></li>
      <li style="height:48px"><span data-t="linkedin" class="sm"></span><span class="t-body">LinkedIn</span><span class="box"></span></li>
      <li style="height:48px"><span data-t="threads" class="sm"></span><span class="t-body">Threads</span><span class="box"></span></li>
    </ul>
    <div class="foot"><a class="btn primary">Next</a><a class="lnk">Just show me</a></div>
  </div></div></div>

  <!-- 3 First clean app: D's plate sheet -->
  <div class="cell sheet3"><p class="cap">First clean app, live</p>
  <div class="phone sheeted"><div class="scr" style="padding:54px 0 0">
    <div data-chrome="YouTube"></div>
    <div data-site="yt-mode"></div>
    <div class="plate sheet" style="height:318px" data-sheet='{"cyg":132,"gone":["Shorts","Home feed","Up next"],"title":"This is YouTube in Idyll","body":"No Shorts, no home feed. Search and subscriptions are here.","l":"Back to YouTube","r":"OK"}'></div>
  </div></div></div>

  <!-- 4 That's Idyll -->
  <div class="cell"><p class="cap">That's Idyll, optional chapters</p>
  <div class="phone"><div class="scr">
    <div class="pad" style="margin-top:22px"><span class="print smallcyg" data-print="cygnet" data-flat data-water="none" data-cell="2.2" aria-hidden="true" style="display:block;width:56px;height:33.2px"></span></div>
    <div class="pad" style="margin-top:20px">
      <h1 class="t-title-l">That's Idyll<b class="stop">.</b></h1>
      <p class="t-body soft" style="margin-top:12px;max-width:19em">Everything below is optional. Do any of it now, later, or never.</p>
    </div>
    <ul class="rows pad" style="margin-top:28px">
      <li style="padding:14px 0"><div><p class="t-body-m">Time in the real apps</p><p class="t-small soft">A daily allowance for the real Instagram, TikTok and the rest.</p></div><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></li>
      <li style="padding:14px 0"><div><p class="t-body-m">Sleep</p><p class="t-small soft">The real apps rest at night.</p></div><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></li>
      <li style="padding:14px 0"><div><p class="t-body-m">Focus</p><p class="t-small soft">One tap pauses them while you work.</p></div><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></li>
      <li style="padding:14px 0"><div><p class="t-body-m">Safari</p><p class="t-small soft">Tidy the same sites in Safari.</p></div><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></li>
      <li style="padding:14px 0"><div><p class="t-body-m">Send the real apps here</p><p class="t-small soft">Open Instagram, land in Idyll.</p></div><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></li>
    </ul>
    <div class="foot"><a class="btn primary">Go to Idyll</a></div>
  </div></div></div>

  <!-- 5 Home -->
  <div class="cell home"><p class="cap">Home</p>
  <div class="phone"><div class="scr">
    <div class="navb" style="padding:0 20px 0 24px;margin-top:6px;justify-content:space-between"><span class="t-wordmark logo" style="display:flex;align-items:center;gap:10px"><span class="print smallcyg" data-print="cygnet" data-flat data-water="none" data-cell="1.8" aria-hidden="true" style="display:block;width:34px;height:20.2px"></span><span>Idyll<b class="stop">.</b></span></span><a>Settings</a></div>
    <div class="pad" style="margin-top:26px">
      <p class="t-label">Today in the real apps</p>
      <p class="t-num-l" style="font-size:50px;margin-top:10px">18 <span class="soft">of 30 min</span></p>
      <div class="bar-track" style="margin-top:16px"><i style="width:60%"></i></div>
      <p class="t-label" style="margin-top:9px;display:flex;justify-content:space-between"><span>Screen Time's count</span><span>Sample numbers</span></p>
    </div>
    <ul class="rows pad" style="margin-top:24px">
      <li style="height:54px"><span data-t="instagram"></span><span class="t-body-m">Instagram</span><span class="t-small soft n" style="margin-left:auto">11 min</span></li>
      <li style="height:54px"><span data-t="youtube"></span><span class="t-body-m">YouTube</span><span class="t-small soft n" style="margin-left:auto">5 min</span></li>
      <li style="height:54px"><span data-t="x"></span><span class="t-body-m">X</span><span class="t-small soft n" style="margin-left:auto">2 min</span></li>
      <li style="height:54px"><span data-t="reddit"></span><span class="t-body-m">Reddit</span><span class="t-small soft n" style="margin-left:auto">0 min</span></li>
    </ul>
    <div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px">
      <a class="btn primary" style="height:64px;flex-direction:column;gap:5px">Focus<span class="t-cap" style="opacity:.8">50 min</span></a>
      <a class="btn secondary" style="height:64px;flex-direction:column;gap:5px">Post Mode<span class="t-cap soft">Real apps, 10 min</span></a>
    </div>
    <div class="pad" style="margin-top:12px"><div class="field"><svg class="ic soft" style="width:20px"><use href="#i-link"/></svg><span class="t-body soft" style="font-size:16px">Paste a link</span><a class="t-small" style="margin-left:auto;font-size:15px">Paste</a></div>
      <p class="t-cap soft" style="margin-top:8px">One video or post opens on its own, with nothing after it.</p></div>
    <div class="pad" style="margin-top:auto;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center"><span class="t-small" style="display:flex;align-items:center;gap:8px"><span class="print smallcyg" data-print="cygnet" data-flat data-water="none" data-cell="1.6" aria-hidden="true" style="display:block;width:26px;height:15.4px"></span>Resting from 23:00</span><span class="t-small soft">Free, for good.</span></div>
  </div></div></div>

  <!-- 6 A site's settings -->
  <div class="cell"><p class="cap">A site's settings</p>
  <div class="phone"><div class="scr">
    <div class="navb"><svg class="ic"><use href="#i-chevl"/></svg>Home</div>
    <div class="pad" style="display:flex;align-items:center;gap:14px;margin-top:10px"><span data-t="instagram"></span><h1 class="t-title-m">Instagram<b class="stop">.</b></h1></div>
    <div class="pad" style="margin-top:28px"><p class="t-label">Gone</p><p class="t-small soft" style="margin-top:4px">Switch one off to bring it back.</p></div>
    <ul class="rows pad" style="margin-top:12px">
      <li style="height:50px"><span class="t-body"><span class="struck">Reels</span></span><span class="sw on" style="margin-left:auto"></span></li>
      <li style="height:50px"><span class="t-body"><span class="struck">Explore</span></span><span class="sw on" style="margin-left:auto"></span></li>
      <li style="height:50px"><span class="t-body"><span class="struck">Suggested posts</span></span><span class="sw on" style="margin-left:auto"></span></li>

<script>
/* Build the board before kit.js runs. ?mode=dark|light keeps one mode; ?only=N then picks a screen:
   1 to 12 the screens, 13 to 16 the riffs, 17 Home in electric blue. */
window.IDYLL_ROOT = '../../../';
(() => {
  const q = new URLSearchParams(location.search), want = q.get('mode');
  const board = document.getElementById('board');
  const modes = ['dark', 'light'].filter(m => !want || m === want);
  const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
  const IMG = '../../../img/photos/';
  const chrome = t => `<div class="chrome chrome-bg" style="border-bottom:1px solid var(--hair)"><span class="hb"><span class="print smallcyg" data-print="cygnet" data-flat data-water="none" data-cell="1.7" aria-hidden="true" style="display:block;width:30px;height:17.8px"></span></span><span class="t">${t}</span><span class="hb">${ic('sliders')}</span></div>`;
  const tbar = `<div class="tbar chrome-bg" style="border-top:1px solid var(--hair)"><span class="hb">${ic('chevl')}</span><span class="hb off">${ic('chev')}</span><span class="hb">${ic('share')}</span><span class="hb">${ic('reload')}</span></div>`;
  const ig = dark => `<div class="ig${dark ? ' dark' : ''}"><div class="ihd"><span>Following ⌄</span><span>${ic('bell')}${ic('msg')}</span></div>
    <div class="stories">${[['M', '#ffe1ef', '#a8105c', 'maya.walks'], ['L', '#ffe8d4', '#9a4a12', 'leo.makes'], ['P', '#e3e9ff', '#1a3fd6', 'priya.reads'], ['S', '#ddf3e6', '#1f6b45', 'sam_k']].map(([l, b, c, n]) => `<div><i style="background:${b};color:${c}">${l}</i>${n}</div>`).join('')}</div>
    <div class="ph"><i style="background:#ffe1ef;color:#a8105c">M</i><b>maya.walks</b><small>2h</small></div><div class="img"><img src="${IMG}128.jpg" alt=""></div>
    <div class="acts">${ic('bell')}${ic('msg')}${ic('share')}</div><p class="cap2"><b>maya.walks</b> Swam before breakfast. Freezing. Perfect.</p></div>`;
  const ytwatch = dark => `<div class="yw${dark ? ' dark' : ''}"><div class="player"><img src="${IMG}76.jpg" alt=""><span class="rp"><span>${ic('reload')}Replay</span></span><span class="pb"></span></div>
    <h3>She rides again</h3><p class="mt">Leo Marsh · 312 views · 3 days ago</p><div class="chn"><i>L</i>Leo Marsh</div></div>`;
  const sheet = (d) => `<div class="crop"></div>
    <div class="print cyg sigcyg" data-print="cygnet" style="position:absolute;left:28px;top:30px;width:${d.cyg}px"></div>
    <div style="position:absolute;left:176px;right:28px;top:34px"><p class="t-label">Gone</p><p class="t-small" style="margin-top:8px;display:grid;gap:4px;font-size:15px">${d.gone.map(g => `<span><span class="struck">${g}</span></span>`).join('')}</p></div>
    <div style="position:absolute;left:28px;right:28px;top:148px"><p class="t-sheet">${d.title}<b class="stop">.</b></p><p class="t-small" style="margin-top:8px;font-size:15px">${d.body}</p>
    <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:15px"><a>${d.l}</a><a>${d.r}</a></div></div>`;

  const ACCENTS = { magenta: ['#d81b7a', '#2d5bff'], blue: ['#2d5bff', '#d81b7a'], black: ['#161514', '#d81b7a'] };
  function prep(root, mode, accent = 'magenta') {
    /* Appearance: the chosen accent and icon show as selected. */
    { const i = { magenta: 0, blue: 1, black: 2 }[accent] ?? 0;
      root.querySelectorAll('.swatch').forEach((el, n) => { const tick = el.querySelector('.ok'); if (n === i) { el.classList.add('sel'); if (!tick) el.insertAdjacentHTML('beforeend', '<span class="ok"><svg class="ic"><use href="#i-check"/></svg></span>'); } else { el.classList.remove('sel'); tick && tick.remove(); } });
      root.querySelectorAll('.icn .choice').forEach((el, n) => { const tick = el.querySelector('.ok'); if (n === i) { el.classList.add('sel'); if (!tick) el.insertAdjacentHTML('beforeend', '<span class="ok" style="top:-8px;right:-8px"><svg class="ic"><use href="#i-check"/></svg></span>'); } else { el.classList.remove('sel'); tick && tick.remove(); } }); }
    const dark = mode === 'dark';
    const [acc, ink2] = ACCENTS[accent];
    root.querySelectorAll('.cap').forEach(c => { const n = c.closest('.cell').dataset.idx; c.insertAdjacentHTML('afterbegin', `<b>${n}</b>`); });
    root.querySelectorAll('[data-chrome]').forEach(e => e.outerHTML = chrome(e.dataset.chrome));
    root.querySelectorAll('[data-tbar]').forEach(e => e.outerHTML = tbar);
    root.querySelectorAll('[data-page="ig"]').forEach(e => e.outerHTML = ig(dark));
    root.querySelectorAll('[data-page="ytwatch"]').forEach(e => e.outerHTML = ytwatch(dark));
    root.querySelectorAll('[data-site="yt-mode"]').forEach(s => s.dataset.site = dark ? 'yt-dark' : 'yt');
    root.querySelectorAll('[data-sheet]').forEach(s => s.innerHTML = sheet(JSON.parse(s.dataset.sheet)));
    if (!dark) root.querySelectorAll('.phone.hello').forEach(p => p.classList.add('onplate'));
    root.querySelectorAll('.phone').forEach(p => { if (dark || p.classList.contains('onplate')) p.classList.add('lightbar'); if (dark || p.classList.contains('onplate') || p.classList.contains('sheeted')) p.classList.add('lighthi'); });
    /* Halftone cygnets (large moments only): cream, with the second ink as water. */
    /* Small halftone cygnets (logo, nav, glints): the accent on paper, cream on night, flat tone and a per-size pitch. */
    root.querySelectorAll('.smallcyg').forEach(g => g.dataset.ink = dark ? '#fff6ee' : acc);
    root.querySelectorAll('.sigcyg').forEach(g => g.dataset.water = ink2);
    root.querySelectorAll('.print[data-print="mark"]').forEach(g => g.dataset.strike = ink2);
  }
  function addRow(title, groups) {
    board.insertAdjacentHTML('beforeend', `<p class="rowname">${title}<b class="stop">.</b></p>`);
    const row = document.createElement('section'); row.className = 'row';
    groups.forEach(({ mode, cells, accent }) => cells.forEach(c => {
      c.classList.add(`m-${mode}`); if (mode === 'dark') c.classList.add('mono'); if (accent && accent !== 'magenta') c.classList.add(`acc-${accent}`);
      row.appendChild(c); prep(c, mode, accent);
    }));
    board.appendChild(row);
  }
  const clone = id => [...document.getElementById(id).content.cloneNode(true).children];
  const number = (cells, start) => cells.forEach((c, i) => c.dataset.idx = String(start + i).padStart(2, '0'));
  const name = m => m === 'dark' ? 'Dark' : 'Light';
  const urlAccent = new URLSearchParams(location.search).get('accent') || 'magenta';
  modes.forEach(m => { const c = clone('screens'); number(c, 1); addRow(name(m), [{ mode: m, cells: c, accent: urlAccent }]); });
  board.insertAdjacentHTML('beforeend', `<h2 class="section">Riffs on the first-run sheet<b class="stop">.</b></h2><p>The plate sheet from screen 3, four ways, dark then light. The plate is always the accent with cream type, so it reads the same in both modes.</p>`);
  addRow(modes.map(name).join(', then '), modes.map(m => { const c = clone('riffs'); number(c, 13); c.forEach(x => x.querySelector('.cap').append(`, ${m}`)); return { mode: m, cells: c }; }));
  board.insertAdjacentHTML('beforeend', `<h2 class="section">Accents<b class="stop">.</b></h2><p>Chosen in Settings, Appearance. Only the accent, the second ink and the plate change. Electric blue swaps places with magenta. Black is ink on paper with an ink plate; on night it turns cream, with a raised near-black plate. Magenta is its second ink.</p>`);
  const pick = (cls, start, label, accent) => modes.map(m => { const c = clone('screens').filter(e => cls.some(k => e.classList.contains(k))); number(c, start); c.forEach(x => { const cap = x.querySelector('.cap'); cap.textContent = `${cap.textContent}, ${label}, ${m}`; }); return { mode: m, cells: c, accent }; });
  addRow('Electric blue', pick(['home'], 17, 'electric blue', 'blue'));
  addRow('Black', pick(['home', 'sheet3'], 18, 'black', 'black'));
})();
</script>
<script src="../kit.js"></script>
</body>
