<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idyll picker</title>
<link rel="stylesheet" href="../../../fonts.css">
<style>
:root { --paper: #f6f4ef; --ink: #141416; --mag: #d81b7a; --blue: #2d5bff; --mute: #6c6a66; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 "Timeless Sans", system-ui, sans-serif; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 80px; }
header { padding: 40px 0 24px; }
h1 { font-weight: 500; font-size: clamp(36px, 6vw, 72px); line-height: .9; letter-spacing: -.05em; margin: 0 0 14px; }
header p { margin: 0; max-width: 640px; }
.try { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--ink); padding: 12px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font: 13px/1 "Paper Mono", monospace; }
.try select { font: inherit; margin-left: 6px; }
.try a { color: var(--ink); }
section { padding-top: 40px; }
h2 { font-weight: 500; font-size: 28px; letter-spacing: -.03em; margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px 18px; }
figure { margin: 0; }
figure a { display: block; border: 1px solid #d9d5cc; background: #fff; }
figure a:hover { border-color: var(--mag); }
figure a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
figure img { display: block; width: 100%; height: auto; }
figcaption { margin-top: 8px; font-size: 14px; color: var(--mute); }
figcaption b { font: 500 12px/1 "Paper Mono", monospace; color: var(--ink); margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pick one of each.</h1>
    <p>Five choices, eleven options each. Option 0 is the page as it is now. Click any picture to open that option live, or set all five below and open the combination.</p>
  </header>

<script>
const sel = [...document.querySelectorAll(".try select")], go = document.getElementById("go");
const upd = () => { const q = sel.filter(s => s.value !== "0").map(s => s.dataset.k + "=" + s.value).join("&"); go.href = "../" + (q ? "?" + q : ""); };
sel.forEach(s => s.addEventListener("change", upd));
</script>
